<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <title>בדיקת API</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>בדיקת API</h1>
    
    <button onclick="testEmployees()">בדוק עובדים</button>
    <button onclick="testEquipment()">בדוק צב״דים</button>
    
    <div id="result"></div>
    
    <script>
        async function testEmployees() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>בודק עובדים...</p>';
            
            try {
                const response = await fetch('/api/employees');
                const data = await response.json();
                result.innerHTML = `
                    <p class="success">✅ הצלחה!</p>
                    <p>נמצאו ${data.length} עובדים</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `
                    <p class="error">❌ שגיאה!</p>
                    <pre>${error.message}</pre>
                `;
            }
        }
        
        async function testEquipment() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>בודק צב״דים...</p>';
            
            try {
                const response = await fetch('/api/equipment');
                const data = await response.json();
                result.innerHTML = `
                    <p class="success">✅ הצלחה!</p>
                    <p>נמצאו ${data.length} צב״דים</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `
                    <p class="error">❌ שגיאה!</p>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
